name: Temporary Clippy repair

on:
  push:
    branches:
      - fix/rustfmt-ci

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rustfmt-ci

      - name: Apply manual_strip repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/sitl/src/bin/rip_sitl_live.rs')
          text = path.read_text(encoding='utf-8')
          old = '''} else if trimmed.starts_with("arm ") {
              let value = trimmed[4..]'''
          new = '''} else if let Some(stripped) = trimmed.strip_prefix("arm ") {
              let value = stripped'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one manual arm-prefix pattern, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sitl/src/bin/rip_sitl_live.rs
          if git diff --cached --quiet; then
            echo "No repair needed"
            exit 0
          fi
          git commit -m "Fix Clippy manual prefix stripping"
          git push origin HEAD:fix/rustfmt-ci
