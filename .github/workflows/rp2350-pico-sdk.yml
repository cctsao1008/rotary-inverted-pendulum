name: RP2350 Pico SDK

on:
  push:
    branches: [main]
    paths:
      - "firmware/targets/rp2350a/**"
      - ".github/workflows/rp2350-pico-sdk.yml"
  pull_request:
    paths:
      - "firmware/targets/rp2350a/**"
      - ".github/workflows/rp2350-pico-sdk.yml"

permissions:
  contents: read

concurrency:
  group: rp2350-pico-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arm embedded toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Checkout Raspberry Pi Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.1
          path: _deps/pico-sdk
          submodules: recursive

      - name: Configure RP2350A firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/_deps/pico-sdk
        run: |
          cmake \
            -S firmware/targets/rp2350a \
            -B build/rp2350a \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build RP2350A firmware
        run: cmake --build build/rp2350a --parallel 2

      - name: Verify firmware outputs
        run: |
          test -f build/rp2350a/rip_rp2350a.elf
          test -f build/rp2350a/rip_rp2350a.bin
          test -f build/rp2350a/rip_rp2350a.uf2
