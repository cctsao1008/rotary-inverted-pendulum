name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7m-none-eabi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Host tests
        run: cargo test-host
      - name: SITL deterministic skeleton
        run: |
          rm -rf target/sitl-run-a target/sitl-run-b
          cargo run -p rip-sitl --release -- --scenario tools/sitl/scenarios/deterministic_smoke.toml --output target/sitl-run-a
          cargo run -p rip-sitl --release -- --scenario tools/sitl/scenarios/deterministic_smoke.toml --output target/sitl-run-b
          cmp target/sitl-run-a/manifest.json target/sitl-run-b/manifest.json
          cmp target/sitl-run-a/trace.jsonl target/sitl-run-b/trace.jsonl
          cmp target/sitl-run-a/summary.json target/sitl-run-b/summary.json
      - name: SIL smoke scenarios
        run: |
          cargo run -p rip-simulation --release -- --scenario balance --duration-s 5 --no-csv
          cargo run -p rip-simulation --release -- --scenario swingup --duration-s 5 --no-csv
      - name: Clippy
        run: cargo clippy --workspace --exclude rip-firmware-stm32f103 --all-targets -- -D warnings
      - name: STM32F103 release build
        run: cargo build-stm32f103
