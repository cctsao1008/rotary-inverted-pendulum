name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7m-none-eabi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Host tests
        run: cargo test-host
      - name: Clippy
        run: cargo clippy --workspace --exclude rip-firmware-stm32f103 --all-targets -- -D warnings
      - name: STM32F103 check
        run: cargo check -p rip-firmware-stm32f103 --target thumbv7m-none-eabi
