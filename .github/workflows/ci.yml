name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7m-none-eabi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace check
        run: cargo check --workspace --exclude rip-firmware-stm32f103 --all-targets
      - name: Host tests
        run: cargo test-host
      - name: Parameter provenance consistency
        run: python tools/model/check_parameter_provenance.py
      - name: Install model correlation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/model/requirements.txt
      - name: Independent Furuta model correlation
        run: |
          rm -rf target/model-correlation
          cargo run -p rip-sitl --release --bin plant_reference_trace -- \
            --fixture tools/model/fixtures/reference_nominal_correlation.json \
            --output target/model-correlation/rust-trace.json
          python tools/model/reference_furuta.py \
            --fixture tools/model/fixtures/reference_nominal_correlation.json \
            --rust-trace target/model-correlation/rust-trace.json \
            --summary target/model-correlation/summary.json \
            --max-abs-error 2e-4
      - name: SITL deterministic skeleton
        run: |
          rm -rf target/sitl-run-a target/sitl-run-b
          cargo run -p rip-sitl --release --bin rip-sitl -- \
            --scenario tools/sitl/scenarios/deterministic_smoke.toml \
            --output target/sitl-run-a \
            --system-identifier rotary-inverted-pendulum \
            --git-commit "$GITHUB_SHA"
          cargo run -p rip-sitl --release --bin rip-sitl -- \
            --scenario tools/sitl/scenarios/deterministic_smoke.toml \
            --output target/sitl-run-b \
            --system-identifier rotary-inverted-pendulum \
            --git-commit "$GITHUB_SHA"
          cmp target/sitl-run-a/manifest.json target/sitl-run-b/manifest.json
          cmp target/sitl-run-a/trace.jsonl target/sitl-run-b/trace.jsonl
          cmp target/sitl-run-a/summary.json target/sitl-run-b/summary.json
      - name: Rotary full semantic-path SITL
        run: |
          rm -rf target/sitl-balance-a target/sitl-balance-b target/sitl-swingup
          cargo run -p rip-sitl --release --bin rip-sitl -- \
            --scenario tools/sitl/scenarios/rotary_balance.toml \
            --parameters parameters/reference-assembly.json \
            --output target/sitl-balance-a \
            --system-identifier rotary-inverted-pendulum \
            --git-commit "$GITHUB_SHA"
          cargo run -p rip-sitl --release --bin rip-sitl -- \
            --scenario tools/sitl/scenarios/rotary_balance.toml \
            --parameters parameters/reference-assembly.json \
            --output target/sitl-balance-b \
            --system-identifier rotary-inverted-pendulum \
            --git-commit "$GITHUB_SHA"
          cmp target/sitl-balance-a/manifest.json target/sitl-balance-b/manifest.json
          cmp target/sitl-balance-a/trace.jsonl target/sitl-balance-b/trace.jsonl
          cmp target/sitl-balance-a/summary.json target/sitl-balance-b/summary.json
          cargo run -p rip-sitl --release --bin rip-sitl -- \
            --scenario tools/sitl/scenarios/rotary_swingup.toml \
            --parameters parameters/reference-assembly.json \
            --output target/sitl-swingup \
            --system-identifier rotary-inverted-pendulum \
            --git-commit "$GITHUB_SHA"
      - name: Clippy
        run: cargo clippy --workspace --exclude rip-firmware-stm32f103 --all-targets -- -D warnings
      - name: STM32F103 release build
        run: cargo build-stm32f103

  rigid-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile rigid-body tooling
        run: |
          python -m py_compile \
            tools/model/rigid_body/build_furuta_urdf.py \
            tools/model/rigid_body/pybullet_furuta.py
      - name: Build nominal Furuta URDF contract
        run: |
          rm -rf target/model-rigid-body
          python tools/model/rigid_body/build_furuta_urdf.py \
            --output target/model-rigid-body/furuta.urdf \
            --manifest target/model-rigid-body/manifest.json
      - name: Install PyBullet validation dependency
        run: python -m pip install --disable-pip-version-check -r tools/model/requirements-rigid-body.txt
      - name: Deterministic PyBullet rigid-body trace
        run: |
          python tools/model/rigid_body/pybullet_furuta.py \
            --fixture tools/model/fixtures/reference_nominal_correlation.json \
            --output target/model-rigid-body/pybullet-trace-a.json
          python tools/model/rigid_body/pybullet_furuta.py \
            --fixture tools/model/fixtures/reference_nominal_correlation.json \
            --output target/model-rigid-body/pybullet-trace-b.json
          cmp target/model-rigid-body/pybullet-trace-a.json target/model-rigid-body/pybullet-trace-b.json
