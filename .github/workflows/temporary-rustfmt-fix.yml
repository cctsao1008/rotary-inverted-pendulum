name: Temporary rustfmt repair

on:
  push:
    branches:
      - fix/rustfmt-ci

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/rustfmt-ci

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply cargo fmt
        run: cargo fmt --all

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply cargo fmt"
          git push origin HEAD:fix/rustfmt-ci
