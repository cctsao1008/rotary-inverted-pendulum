[workspace]
members = [
    "plant/robot-domain",
    "plant/plant-observation",
    "plant/measurement-model",
    "plant/actuator-model",
    "control/state-feedback",
    "control/hybrid-control",
    "supervisor/state-estimator",
    "supervisor/runtime-state",
    "supervisor/control-runtime",
    "firmware/interfaces/actuation",
    "firmware/actuators/tb6612",
    "firmware/adapters/estimator-input",
    "firmware/targets/stm32f103",
]
default-members = [
    "plant/robot-domain",
    "plant/plant-observation",
    "plant/measurement-model",
    "plant/actuator-model",
    "control/state-feedback",
    "control/hybrid-control",
    "supervisor/state-estimator",
    "supervisor/runtime-state",
    "supervisor/control-runtime",
    "firmware/interfaces/actuation",
    "firmware/actuators/tb6612",
    "firmware/adapters/estimator-input",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
